name: Send Automated Report Email

on:
  schedule:
    - cron: '0 18 * * 5'   # Friday 12:00 PM MDT (summer) — will run 1 hr later in MT during MST
  workflow_dispatch: {}

jobs:
  send-email:
    runs-on: ubuntu-latest
    env:
      TZ: America/Denver
      CDWR_API_KEY: ${{ secrets.CDWR_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      DASHBOARD_LINK: ${{ secrets.DASHBOARD_LINK }}
      STAFF_EMAIL: ${{ secrets.STAFF_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Setup - Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          packages: |
            any::arrow
            any::ggplot2
            any::dplyr
            any::lubridate
            any::httr2
            any::base64enc
            any::tidyverse
            any::xgboost
            any::glue
            any::remotes
            any::yaml
            github::anguswg-ucsb/cdssr

      - name: Run report script
        run: Rscript gha_scripts/send_report.R
